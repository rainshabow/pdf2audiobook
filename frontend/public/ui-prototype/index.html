<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PDF 转语音 · UI 原型（绿白工作台）</title>
<link rel="stylesheet" href="./styles.css" />
</head>
<body>
<div class="app">
  <!-- ===================== 左侧工作台导航 ===================== -->
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
      </div>
      <div>
        <div class="brand-name">听书工坊</div>
        <div class="brand-sub">PDF → 有声书</div>
      </div>
    </div>

    <div class="nav-label">工作台</div>
    <button class="nav-item active" data-nav="books">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
      书架 <span class="nav-count" id="navBookCount">2</span>
    </button>
    <button class="nav-item" data-nav="jobs">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
      任务中心 <span class="nav-count" id="navJobCount">2</span>
    </button>

    <div class="nav-label">系统</div>
    <button class="nav-item" data-nav="settings">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      设置
    </button>

    <div class="side-foot">
      <div class="engine-pill"><span class="live-dot"></span> MiMo 引擎 · 在线</div>
    </div>
  </aside>

  <!-- ===================== 主区域 ===================== -->
  <div class="main">
    <header class="topbar">
      <div class="crumbs" id="crumbs"></div>
      <div class="top-spacer"></div>
      <button class="icon-btn" title="通知">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        <span class="dot-badge"></span>
      </button>
      <button class="icon-btn" title="用户" style="border-radius:50%;background:var(--green-100);color:var(--green-700);font-weight:700">R</button>
    </header>

    <main class="content">

      <!-- ============ 书架 ============ -->
      <section class="view active" id="view-books">
        <div class="page-head">
          <div><h1>书架</h1><div class="sub">导入 PDF，自动转成可听的章节与字幕</div></div>
          <button class="btn btn-primary" onclick="simulateUpload()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
            导入 PDF
          </button>
        </div>
        <div class="upload-zone" id="uploadZone" onclick="simulateUpload()">
          <div class="up-icon">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M17 8l-5-5-5 5"/><path d="M12 3v12"/></svg>
          </div>
          <div style="font-weight:700;font-size:15px">拖入 PDF，或点击选择文件</div>
          <div class="muted" style="margin-top:6px;font-size:12px">解析章节 → 口语化改写 → 分章合成语音与字幕</div>
        </div>
        <div class="section-title" style="margin-top:26px">我的书籍 <span class="muted" style="font-weight:400;font-size:13px">· 点击卡片进入工作台</span></div>
        <div class="books-grid" id="booksGrid"></div>
      </section>

      <!-- ============ 书籍工作台 ============ -->
      <section class="view" id="view-book">
        <div id="bookDetail"></div>
      </section>

      <!-- ============ 章节工作台 ============ -->
      <section class="view" id="view-chapter">
        <div id="chapterWB"></div>
      </section>

      <!-- ============ 任务中心 ============ -->
      <section class="view" id="view-jobs">
        <div class="page-head">
          <div><h1>任务中心</h1><div class="sub">合成与改写并行执行，点击任务可跳转到对应章节</div></div>
          <button class="btn btn-ghost btn-sm" onclick="renderJobs(true)">刷新</button>
        </div>
        <div id="jobsContent"></div>
      </section>

      <!-- ============ 设置 ============ -->
      <section class="view" id="view-settings">
        <div class="page-head">
          <div><h1>设置</h1><div class="sub">所有修改即时保存 · 绿点为当前引擎</div></div>
        </div>
        <div class="settings-grid" id="settingsGrid"></div>
      </section>

    </main>
  </div>
</div>
<div id="toast"></div>
<script src="./app.js"></script>
</body>
</html>
